name: election_flutter_app
description: A new Flutter application for  student council election.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  animated_text_kit: ^4.2.2
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  flutter_countdown_timer: ^4.1.0
  confetti: ^0.7.0
  rflutter_alert: ^2.0.7
  image_picker: ^1.1.2
  excel: ^4.0.0
  path_provider: ^2.1.0
  open_filex: ^4.7.0
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/smk_taruna_bhakti.png
    - assets/vote_illustration.png
    - assets/check_success.png
